<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFF8F0" />
    <meta
      name="description"
      content="MoodBloom is a gentle personal mood journal. Your feelings, your stories, your little world."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Nunito:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <title>MoodBloom</title>
    <script>
      // Runs before the page paints: remember dark appearances so there is no white flash while the app loads.
      (function () {
        try {
          var a = JSON.parse(localStorage.getItem('moodbloom.appearance.v1') || 'null');
          var k = a && a.theme ? a.theme : 'light';
          var worlds = ['unicorn', 'cosmic', 'nature', 'ocean', 'cozy', 'sakura'];
          if (worlds.indexOf(k) > -1) k += a.variant === 'night' ? '-night' : '-day';
          var dark = k === 'dark' || /-night$/.test(k);
          var r = document.documentElement;
          r.setAttribute('data-theme', k);
          r.setAttribute('data-mode', dark ? 'dark' : 'light');
          if (dark) r.style.backgroundColor = '#181325';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
